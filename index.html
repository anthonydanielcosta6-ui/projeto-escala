<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escala Sonoplastia </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(135deg,#020617,#0f172a,#111827);
    min-height:100vh;
    color:white;
    padding:25px;
}

.container{
    max-width:1300px;
    margin:auto;
}

.header{
    margin-bottom:30px;
}

.header h1{
    font-size:42px;
    font-weight:700;
}

.header p{
    color:#cbd5e1;
    margin-top:10px;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.input-group label{
    color:#cbd5e1;
    font-size:14px;
}

input, select{
    height:54px;
    border:none;
    outline:none;
    border-radius:14px;
    padding:0 15px;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
    font-size:15px;
}

input:focus,
select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,0.2);
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:none;
    border-radius:14px;
    padding:14px 20px;
    color:white;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
}

button:hover{
    transform:translateY(-2px);
}

.btn-save{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.btn-cancel{
    background:#475569;
}

.btn-edit{
    background:#f59e0b;
}

.btn-delete{
    background:#ef4444;
}

.status{
    margin-top:15px;
    color:#cbd5e1;
}

.dias-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.dia-card{
    background:#0f172a;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    overflow:hidden;
}

.dia-header{
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
    padding:18px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
}

.dia-content{
    display:none;
    padding:18px;
}

.pessoa{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.nome{
    font-weight:600;
}

.funcao{
    color:#93c5fd;
    font-size:14px;
}

.actions{
    display:flex;
    gap:8px;
}

.vazio{
    color:#94a3b8;
    text-align:center;
    padding:10px;
}

.rotate{
    transform:rotate(180deg);
}

.seta{
    transition:0.2s;
}

@media(max-width:700px){

    .header h1{
        font-size:30px;
    }

    body{
        padding:15px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Escala Semanal</h1>

        <p>
            Sistema conectado ao Google Planilhas.
            Uma prova viva de que planilhas viraram religião corporativa.
        </p>
    </div>

    <div class="card">

        <div class="form-grid">

            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

<div class="input-group">
    <label>Função</label>

    <select id="funcao">

        <option value="">
            Selecione a função
        </option>

        <option value="Mesa">
            Mesa
        </option>

        <option value="Computador">
            Computador
        </option>

        <option value="Câmeras">
            Câmeras
        </option>

        <option value="Live">
            Live
        </option>

    </select>

</div>

            <div class="input-group">
                <label>Dia</label>

                <select id="dia">

                    <option value="">Selecione</option>

                    <option>Domingo</option>
                    <option>Segunda-feira</option>
                    <option>Terça-feira</option>
                    <option>Quarta-feira</option>
                    <option>Quinta-feira</option>
                    <option>Sexta-feira</option>
                    <option>Sábado</option>

                </select>

            </div>

        </div>

        <div class="buttons">

            <button class="btn-save" onclick="salvar()">
                Salvar Escala
            </button>

            <button class="btn-cancel" onclick="cancelarEdicao()">
                Cancelar
            </button>

        </div>

        <div class="status" id="status">
            Carregando dados...
        </div>

    </div>

    <div class="dias-container" id="diasContainer"></div>

</div>

<script>

// =========================================
// URL DO SEU APPS SCRIPT
// =========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxhBTmt_PHkEsznTK8w-Rq1dg9pRKdI-pR9PgUC-AYI-rL8xNGM-9xb9YTqBzk2lXzD/exec";

const diasSemana = [
    "Domingo",
    "Segunda-feira",
    "Terça-feira",
    "Quarta-feira",
    "Quinta-feira",
    "Sexta-feira",
    "Sábado"
];

let editando = false;
let editIndex = null;

async function carregarDados(){

    try{

        const resposta = await fetch(API_URL);

        const dados = await resposta.json();

        renderizarDias(dados);

        document.getElementById("status").innerText =
        `${dados.length} pessoas carregadas`;

    }catch(erro){

        console.error(erro);

        document.getElementById("status").innerText =
        "Erro de conexão";

    }

}

function renderizarDias(dados){

    const container =
    document.getElementById("diasContainer");

    container.innerHTML = "";

    diasSemana.forEach((dia,index)=>{

        const pessoas =
        dados.filter(item => item.dia === dia);

        let htmlPessoas = "";

        if(pessoas.length === 0){

            htmlPessoas =
            `<div class="vazio">
                Nenhuma pessoa cadastrada
            </div>`;

        }else{

            pessoas.forEach((pessoa)=>{

                htmlPessoas += `
                    <div class="pessoa">

                        <div>
                            <div class="nome">
                                ${pessoa.nome}
                            </div>

                            <div class="funcao">
                                ${pessoa.funcao}
                            </div>
                        </div>

                        <div class="actions">

                            <button class="btn-edit"
                            onclick='editar(
                                ${pessoa.index},
                                "${pessoa.nome}",
                                "${pessoa.funcao}",
                                "${pessoa.dia}"
                            )'>
                                Editar
                            </button>

                            <button class="btn-delete"
                            onclick='deletar(${pessoa.index})'>
                                Excluir
                            </button>

                        </div>

                    </div>
                `;
            });

        }

        container.innerHTML += `

            <div class="dia-card">

                <div class="dia-header"
                onclick="toggleDia(${index})">

                    <span>${dia}</span>

                    <span class="seta"
                    id="seta-${index}">
                        ▼
                    </span>

                </div>

                <div class="dia-content"
                id="content-${index}">

                    ${htmlPessoas}

                </div>

            </div>

        `;
    });

}

function toggleDia(index){

    const content =
    document.getElementById(`content-${index}`);

    const seta =
    document.getElementById(`seta-${index}`);

    if(content.style.display === "block"){

        content.style.display = "none";

        seta.classList.remove("rotate");

    }else{

        content.style.display = "block";

        seta.classList.add("rotate");

    }

}

async function salvar(){

    const nome =
    document.getElementById("nome").value.trim();

    const funcao =
    document.getElementById("funcao").value.trim();

    const dia =
    document.getElementById("dia").value;

    if(!nome || !funcao || !dia){

        alert("Preencha todos os campos");
        return;
    }

    try{

        let payload = {};

        if(editando){

            payload = {
                action:"update",
                index:editIndex,
                nome,
                funcao,
                dia
            };

        }else{

            payload = {
                action:"add",
                nome,
                funcao,
                dia
            };
        }

        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(payload)
        });

        limparCampos();

        carregarDados();

    }catch(erro){

        console.error(erro);

        alert("Erro ao salvar");

    }

}

function editar(index,nome,funcao,dia){

    editando = true;

    editIndex = index;

    document.getElementById("nome").value = nome;
    document.getElementById("funcao").value = funcao;
    document.getElementById("dia").value = dia;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

async function deletar(index){

    if(!confirm("Deseja excluir?")){
        return;
    }

    try{

        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                action:"delete",
                index:index
            })
        });

        carregarDados();

    }catch(erro){

        console.error(erro);

        alert("Erro ao excluir");

    }

}

function cancelarEdicao(){
    limparCampos();
}

function limparCampos(){

    editando = false;
    editIndex = null;

    document.getElementById("nome").value = "";
    document.getElementById("funcao").value = "";
    document.getElementById("dia").value = "";

}

carregarDados();

</script>

</body>
</html>
