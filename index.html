<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escala Inteligente</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#020617,#0f172a,#111827);
min-height:100vh;
padding:25px;
color:white;
}

.container{
max-width:1300px;
margin:auto;
}

.header{
margin-bottom:30px;
}

.header h1{
font-size:42px;
}

.header p{
margin-top:10px;
color:#cbd5e1;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:24px;
padding:25px;
margin-bottom:25px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
}

.input-group{
display:flex;
flex-direction:column;
gap:8px;
}

.input-group label{
font-size:14px;
color:#cbd5e1;
}

input,select{
height:55px;
border:none;
outline:none;
border-radius:14px;
padding:0 16px;
background:#0f172a;
color:white;
border:1px solid #334155;
font-size:15px;
}

.buttons{
display:flex;
gap:12px;
margin-top:20px;
flex-wrap:wrap;
}

button{
border:none;
border-radius:14px;
padding:14px 22px;
color:white;
font-weight:600;
cursor:pointer;
}

.btn-save{
background:#2563eb;
}

.btn-cancel{
background:#475569;
}

.btn-edit{
background:#f59e0b;
}

.btn-delete{
background:#ef4444;
}

.datas-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.data-card{
background:#0f172a;
border-radius:20px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.08);
}

.data-header{
background:#2563eb;
padding:18px;
font-weight:600;
cursor:pointer;
}

.data-content{
display:none;
padding:18px;
}

.pessoa{
background:rgba(255,255,255,0.04);
border-radius:14px;
padding:14px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.nome{
font-weight:600;
}

.funcao{
color:#93c5fd;
font-size:14px;
margin-top:4px;
}

.data-pessoa{
color:#cbd5e1;
font-size:13px;
margin-top:4px;
}

.actions{
display:flex;
gap:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Escala Inteligente</h1>

<p>
Sistema conectado ao Google Planilhas.
Porque claramente a humanidade decidiu transformar escala em engenharia de software.
</p>

</div>

<div class="card">

<div class="form-grid">

<div class="input-group">

<label>Nome</label>

<input
type="text"
id="nome"
placeholder="Digite o nome"
>

</div>

<div class="input-group">

<label>Função</label>

<select id="funcao">

<option value="">Selecione</option>

<option value="Mesa">Mesa</option>

<option value="Computador">Computador</option>

<option value="Câmeras">Câmeras</option>

<option value="Live">Live</option>

</select>

</div>

<div class="input-group">

<label>Data</label>

<input
type="date"
id="data"
>

</div>

</div>

<div class="buttons">

<button
class="btn-save"
onclick="salvar()"
>
Salvar Escala
</button>

<button
class="btn-cancel"
onclick="cancelarEdicao()"
>
Cancelar
</button>

</div>

</div>

<div
class="datas-container"
id="datasContainer"
></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxSduojHFeiVaqsiMb2m6GurEtCEQxbFuyYwKSdk5B-s2uU11Vh_HOzjyzyq0T0KW42/exec";

let editando = false;
let editIndex = null;

const diasSemana = [
"Domingo",
"Segunda-feira",
"Terça-feira",
"Quarta-feira",
"Quinta-feira",
"Sexta-feira",
"Sábado"
];

async function carregarDados(){

try{

const resposta =
await fetch(API_URL);

const dados =
await resposta.json();

renderizar(dados);

}catch(erro){

console.log(erro);

}

}

function renderizar(dados){

const container =
document.getElementById(
"datasContainer"
);

container.innerHTML = "";

const grupos = {};

dados.forEach(item=>{

if(!grupos[item.dia]){

grupos[item.dia] = [];

}

grupos[item.dia].push(item);

});

Object.keys(grupos).forEach(
(data,index)=>{

let html = "";

grupos[data].forEach(pessoa=>{

html += `

<div class="pessoa">

<div>

<div class="nome">
${pessoa.nome}
</div>

<div class="funcao">
${pessoa.funcao}
</div>

<div class="data-pessoa">
${pessoa.dia}
</div>

</div>

<div class="actions">

<button
class="btn-edit"

onclick='editar(
${pessoa.index},
"${pessoa.nome}",
"${pessoa.funcao}",
"${pessoa.dataOriginal}"
)'
>
Editar
</button>

<button
class="btn-delete"

onclick='deletar(
${pessoa.index}
)'
>
Excluir
</button>

</div>

</div>

`;

});

container.innerHTML += `

<div class="data-card">

<div
class="data-header"
onclick="toggle(${index})"
>

${data}

</div>

<div
class="data-content"
id="content-${index}"
>

${html}

</div>

</div>

`;

});

}

function toggle(index){

const box =
document.getElementById(
`content-${index}`
);

if(box.style.display === "block"){

box.style.display = "none";

}else{

box.style.display = "block";

}

}

async function salvar(){

const nome =
document
.getElementById("nome")
.value
.trim();

const funcao =
document
.getElementById("funcao")
.value;

const dataOriginal =
document
.getElementById("data")
.value;

if(!nome || !funcao || !dataOriginal){

alert(
"Preencha todos os campos"
);

return;

}

const partes =
dataOriginal.split("-");

const ano = partes[0];
const mes = partes[1];
const diaNumero = partes[2];

const dataObj =
new Date(
ano,
mes - 1,
diaNumero
);

const diaSemana =
diasSemana[
dataObj.getDay()
];

const dataFormatada =
`${diaSemana} ${diaNumero}/${mes}/${ano}`;

const payload = {

action:
editando
? "update"
: "add",

index:editIndex,

nome:nome,

funcao:funcao,

dia:dataFormatada,

dataOriginal:dataOriginal

};

try{

await fetch(API_URL,{

method:"POST",

body:JSON.stringify(
payload
)

});

limparCampos();

carregarDados();

}catch(erro){

console.log(erro);

alert(
"Erro ao salvar"
);

}

}

function editar(
index,
nome,
funcao,
dataOriginal
){

editando = true;

editIndex = index;

document
.getElementById("nome")
.value = nome;

document
.getElementById("funcao")
.value = funcao;

document
.getElementById("data")
.value = dataOriginal;

}

async function deletar(index){

await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"delete",

index:index

})

});

carregarDados();

}

function cancelarEdicao(){

limparCampos();

}

function limparCampos(){

editando = false;

editIndex = null;

document
.getElementById("nome")
.value = "";

document
.getElementById("funcao")
.value = "";

document
.getElementById("data")
.value = "";

}

carregarDados();

</script>

</body>
</html>
